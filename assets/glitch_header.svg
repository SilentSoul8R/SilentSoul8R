<svg width="1000" height="210" viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#8A0057"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="210"/>
    </clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
    </pattern>

    <!-- narrow horizontal bands sliced out of the name for jump-cut displacement -->
    <clipPath id="sliceA"><rect x="0" y="68" width="1000" height="10"/></clipPath>
    <clipPath id="sliceB"><rect x="0" y="80" width="1000" height="8"/></clipPath>
    <clipPath id="sliceC"><rect x="0" y="92" width="1000" height="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1000" height="210" fill="url(#bg)"/>
    <g opacity="0.1">
      <rect x="0" y="0" width="1000" height="210" fill="url(#scan)"/>
    </g>

    <!-- MAIN NAME: solid cyan #00F0FF, only color used anywhere in the text -->
    <text x="500" y="100" text-anchor="middle" font-family="Fira Code, monospace"
          font-size="42" font-weight="700" fill="#00F0FF">
      MUHAMMAD ABDULLAH
      <animate attributeName="opacity"
        values="1;1;0.2;1;1;1;0.15;0.6;1;1;0.3;1"
        keyTimes="0;0.3;0.31;0.32;0.55;0.6;0.61;0.63;0.65;0.9;0.91;1"
        dur="3.6s" repeatCount="indefinite"/>
    </text>

    <!-- slice A: jump-cuts sideways, same cyan, opacity used for depth instead of a new hue -->
    <g clip-path="url(#sliceA)">
      <text x="500" y="100" text-anchor="middle" font-family="Fira Code, monospace"
            font-size="42" font-weight="700" fill="#00F0FF" opacity="0.55">
        MUHAMMAD ABDULLAH
        <animate attributeName="x" values="500;500;522;500;500;479;500;500" keyTimes="0;0.3;0.32;0.35;0.6;0.62;0.65;1" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- slice B: jump-cuts the other way, same cyan, full opacity for a punchier edge -->
    <g clip-path="url(#sliceB)">
      <text x="500" y="100" text-anchor="middle" font-family="Fira Code, monospace"
            font-size="42" font-weight="700" fill="#00F0FF">
        MUHAMMAD ABDULLAH
        <animate attributeName="x" values="500;500;483;500;500;514;500;500" keyTimes="0;0.45;0.47;0.5;0.85;0.87;0.9;1" dur="2.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- slice C: occasional black dropout band, like signal cutting out -->
    <g clip-path="url(#sliceC)">
      <rect x="0" y="0" width="1000" height="210" fill="#000000" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0;1;0" keyTimes="0;0.58;0.6;0.62;0.88;0.9;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- background glitch bars, kept off the name -->
    <g fill="#00F0FF" opacity="0.5">
      <rect x="120" y="50" width="180" height="4">
        <animate attributeName="x" values="120;700;300;850;120" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0;0.5;0" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="600" y="145" width="140" height="3">
        <animate attributeName="x" values="600;150;450;50;600" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0;0.4;0" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#FF2079" opacity="0.5">
      <rect x="380" y="150" width="160" height="3">
        <animate attributeName="x" values="380;60;700;250;380" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0;0.4;0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- subtitle -->
    <text x="500" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#FF2079" letter-spacing="1">
      COMPUTER ENGINEERING AT UET LAHORE
    </text>
  </g>
</svg>
