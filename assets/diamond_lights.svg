<svg width="300" height="60" viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="diamond">
      <path d="M0,-14 L14,0 L0,14 L-14,0 Z"/>
    </g>
  </defs>

  <!-- Diamond 1 -->
  <use href="#diamond" x="60" y="30" fill="#E8B923">
    <animate attributeName="fill-opacity" values="0.25;1;0.25;0.25;0.25" keyTimes="0;0.15;0.3;0.85;1" dur="2s" repeatCount="indefinite"/>
  </use>

  <!-- Diamond 2 -->
  <use href="#diamond" x="150" y="30" fill="#E8B923">
    <animate attributeName="fill-opacity" values="0.25;0.25;1;0.25;0.25" keyTimes="0;0.15;0.3;0.45;1" dur="2s" repeatCount="indefinite"/>
  </use>

  <!-- Diamond 3 -->
  <use href="#diamond" x="240" y="30" fill="#E8B923">
    <animate attributeName="fill-opacity" values="0.25;0.25;0.25;1;0.25" keyTimes="0;0.3;0.45;0.6;1" dur="2s" repeatCount="indefinite"/>
  </use>
</svg>
