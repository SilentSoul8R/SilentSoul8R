<svg width="412" height="64" viewBox="0 0 412 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a0012"/>
    </linearGradient>
    <clipPath id="inner0">
      <rect x="8" y="8" width="396" height="48"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="410" height="62" rx="3" fill="url(#bg0)" stroke="#00F0FF" stroke-width="2"/>
  <rect x="8" y="8" width="396" height="48" fill="none" stroke="#00F0FF" stroke-width="0.6" opacity="0.35"/>

  <!-- scanning highlight sweep -->
  <g clip-path="url(#inner0)">
    <rect x="-60" y="8" width="60" height="48" fill="#00F0FF" opacity="0.18">
      <animate attributeName="x" values="-60;412" dur="2.6s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- flickering label text, larger and bolder -->
  <text x="206" y="40" text-anchor="middle" font-family="Fira Code, monospace" font-size="24"
        font-weight="700" fill="#00F0FF" letter-spacing="2">
    &#9619;&#9619;&#9619; ABOUT_ME.sys &#9619;&#9619;&#9619;
    <animate attributeName="opacity"
      values="1;1;0.3;1;1;1;0.15;1"
      keyTimes="0;0.4;0.41;0.43;0.7;0.71;0.72;1"
      dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor block after the label -->
  <rect x="380" y="20" width="12" height="24" fill="#00F0FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
