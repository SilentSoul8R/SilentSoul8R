<svg width="292" height="46" viewBox="0 0 292 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a0012"/>
    </linearGradient>
    <clipPath id="inner0">
      <rect x="6" y="6" width="280" height="34"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="290" height="44" rx="2" fill="url(#bg0)" stroke="#00F0FF" stroke-width="1.5"/>
  <rect x="6" y="6" width="280" height="34" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.35"/>

  <!-- scanning highlight sweep -->
  <g clip-path="url(#inner0)">
    <rect x="-40" y="6" width="40" height="34" fill="#00F0FF" opacity="0.18">
      <animate attributeName="x" values="-40;292" dur="2.6s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- flickering label text -->
  <text x="146" y="29" text-anchor="middle" font-family="Fira Code, monospace" font-size="15"
        font-weight="700" fill="#00F0FF" letter-spacing="2">
    &#9619;&#9619;&#9619; ABOUT_ME.sys &#9619;&#9619;&#9619;
    <animate attributeName="opacity"
      values="1;1;0.3;1;1;1;0.15;1"
      keyTimes="0;0.4;0.41;0.43;0.7;0.71;0.72;1"
      dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor block after the label -->
  <rect x="270" y="16" width="8" height="14" fill="#00F0FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
